name: Penny presentation and gallery checks
on:
  pull_request:
    paths:
      - 'src/components/penny-presentation.js'
      - 'src/components/gallery-slideshow.js'
      - 'src/components/GallerySlideshow.*'
      - 'src/components/CreatorDisplayOrbit.jsx'
      - 'src/components/AskPenny.*'
      - 'src/components/PennyThoughtBubble.*'
      - 'src/JennArt.jsx'
      - 'api/penny.js'
      - 'test/penny-presentation.test.js'
      - '.github/workflows/penny-presentation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/penny-presentation.test.js test/penny-awareness.test.js test/penny-avatar.test.js
