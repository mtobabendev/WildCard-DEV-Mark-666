name: WildCard DEV Universal CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  universal-ci:
    name: Universal CI (build, tests, exact SHA)
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run all tests
        run: node --test
