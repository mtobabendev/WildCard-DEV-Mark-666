name: PennyCore checks
on:
  pull_request:
    paths:
      - 'api/pennycore.js'
      - 'lib/pennycore.js'
      - 'db/pennycore/**'
      - 'test/pennycore.test.js'
      - '.github/workflows/pennycore-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/pennycore.test.js
